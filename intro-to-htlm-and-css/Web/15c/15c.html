<!DOCTYPE html>
<html>
    <head>
        <title>
            15c
        </title>

        <style>
            .container{
                position: absolute;
                top: 50px;
                left: 100px;
            }

            .container1{
                position: absolute;
                top: 50px;
                right: 100px;
            }

            .image{
                width: 200px;
                height: 200px;
            }

            .offer{
                position: absolute;
                top: 10px;
                right: 0px;
                background-color: black;
                color: white;
                padding-left: 8px;
                padding-right: 8px;
                padding-top: 3px;
                padding-bottom: 3px;
                font-size: 12px;
                font-family: Arial, Helvetica, sans-serif;
            }

            .add-box{
                position: absolute;
                background-color: rgba(117, 109, 109, 0.551);
                bottom: 4px;
                right: 0px;
                left: 0px;
                height: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .add-button{
                border: solid;
                border-width: 2px;
                padding-left: 10px;
                padding-right: 10px;
                padding-bottom: 5px;
                padding-top: 5px;
            }

        </style>

    </head>

    <body style="background-color: gray;
    height: 3000px;">

        <div class="container">
            <img class="image" src="macbook.jpeg">
            <div class="offer">
                20% OFF
            </div>
        </div>


        <div class="container1">
            <img class="image" src="macbook.jpeg">
            <div class="offer">
                20% OFF
            </div>
            <div class="add-box">
                <button class="add-button">
                    Add to Cart
                </button>
            </div>
        </div>

    </body>
</html>
